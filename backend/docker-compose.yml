services:
  db:
    image: pgvector/pgvector:pg16
    container_name: corpus-vivo-db
    environment:
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: corpus
      POSTGRES_DB: corpus_vivo
    ports:
      # 5432 suele estar ocupado por otros proyectos locales
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus -d corpus_vivo"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
